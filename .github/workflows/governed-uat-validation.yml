name: EasyCommunity Governed UAT Validation

on:
  push:
    branches:
      - agent/uat-evidence-validation-2026-08-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app.py

      - name: Run governed-candidate tests
        run: python -m pytest -q

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find static -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
